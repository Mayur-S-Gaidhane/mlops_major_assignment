name: CI - build_and_test_container

on:
  push:
    branches: [ docker_ci ]
  workflow_dispatch:

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training script
        run: |
          python src/train.py
          python src/quantize.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mlops_major:ci

      - name: Run container to verify
        run: |
          docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/mlops_major:ci python src/predict.py
